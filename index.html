<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Festive Secret Santa Draw 🎁</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            xmas: {
              red: '#C41E3A',
              darkred: '#780016',
              green: '#165B33',
              lightgreen: '#1BB955',
              gold: '#F8B229'
            }
          },
          fontFamily: {
            festive: ['"Mountains of Christmas"', 'cursive'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      color: #333;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .gift-box {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
      cursor: pointer;
      transition: transform 0.6s ease;
    }
    .gift-box.open .gift-lid { transform: rotate(-110deg) translateY(-20px); }
    .gift-lid {
      position: absolute; top: 0; left: 0; width: 180px; height: 45px;
      background: #C41E3A; border-radius: 8px 8px 0 0; z-index: 2;
      transition: transform 0.8s ease; transform-origin: top left;
    }
    .gift-body {
      position: absolute; top: 40px; left: 10px; width: 160px; height: 130px;
      background: #900C3F; border-radius: 0 0 8px 8px;
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 flex flex-col min-h-screen">
  
  <header class="py-6 px-4 text-center border-b border-white/10 bg-slate-900/40">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎄</span>
        <div class="text-left">
          <h1 class="font-festive text-3xl text-xmas-gold font-bold">Morgan Secret Santa 2026</h1>
          <p class="text-xs text-emerald-200">Secret Santa Draw App</p>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 my-4">

    <!-- SETUP VIEW -->
    <div id="view-setup" class="space-y-6">
      <div class="glass-card rounded-2xl p-6 border-t-4 border-xmas-green">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
          <h2 class="text-xl font-bold text-xmas-green">Add Participants</h2>
          <button onclick="app.clearAll()" class="text-xs text-red-600 font-semibold">Clear All Names</button>
        </div>

        <!-- Add Form -->
        <div class="flex flex-col sm:flex-row gap-2 mb-6">
          <input type="text" id="new-name" placeholder="Member Name (e.g. Gavin)" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
          <input type="text" id="new-wishlist" placeholder="Optional Wishlist / Hint" class="sm:w-1/3 px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
          <button type="button" onclick="app.addParticipant()" class="bg-xmas-green hover:bg-emerald-800 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">
            Add Person
          </button>
        </div>

        <div id="participants-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
      </div>

      <div class="text-center pt-2">
        <button onclick="app.generateDraw()" class="bg-xmas-red hover:bg-red-700 text-white text-lg font-bold px-10 py-4 rounded-2xl shadow-xl transition">
          Perform Christmas Draw!
        </button>
      </div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="view-results" class="hidden space-y-6">
      <div class="glass-card rounded-2xl p-6 border-t-4 border-slate-700">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h3 class="font-bold text-slate-800 text-lg">Participant Shareable Text Links</h3>
          <button onclick="app.showTab('setup')" class="text-xs bg-slate-700 text-white px-3 py-1.5 rounded-lg">Back to Setup</button>
        </div>
        <div id="results-list" class="space-y-3"></div>
      </div>
    </div>

  </main>

  <!-- REVEAL MODAL -->
  <div id="reveal-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden">
    <div class="relative w-full max-w-md bg-slate-900 border border-amber-500/30 rounded-3xl p-6 text-center text-white shadow-2xl">
      <div id="reveal-step-confirm" class="space-y-4 py-4">
        <h3 class="font-festive text-3xl text-xmas-gold font-bold" id="reveal-target-name">Hello!</h3>
        <p class="text-sm text-slate-300">Ready to reveal your Secret Santa recipient?</p>
        <button onclick="app.proceedToUnwrap()" class="w-full bg-xmas-red hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg">
          Yes, Reveal Now!
        </button>
      </div>

      <div id="reveal-step-unwrap" class="hidden space-y-4 py-6">
        <p class="text-xs text-emerald-400 font-semibold uppercase">Tap the box to unwrap!</p>
        <div class="gift-box" id="interactive-gift" onclick="app.unwrapGiftAnimation()">
          <div class="gift-lid"></div>
          <div class="gift-body"></div>
        </div>
      </div>

      <div id="reveal-step-final" class="hidden space-y-4 py-2">
        <p class="text-xs text-amber-300 font-bold uppercase">You Drew:</p>
        <div class="bg-amber-500/20 border border-xmas-gold/50 rounded-2xl p-4">
          <h2 id="assigned-person-name" class="font-festive text-4xl font-bold text-xmas-gold"></h2>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-left text-xs text-slate-300">
          <span class="font-bold text-emerald-400">Wishlist / Ideas:</span>
          <p id="assigned-person-wishlist" class="italic text-slate-200 mt-1"></p>
        </div>
        <button onclick="app.closeRevealModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs mt-4">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    class SecretSantaApp {
      constructor() {
        this.participants = [];
        this.matches = {};
        this.init();
      }

      init() {
        this.loadState();
        this.renderParticipants();
        this.checkURLForReveal();
      }

      loadState() {
        const saved = localStorage.getItem('morgan_santa_participants');
        if (saved) {
          this.participants = JSON.parse(saved);
        } else {
          this.participants = [
            { id: '1', name: 'Gavin', wishlist: '' },
            { id: '2', name: 'Morgan', wishlist: '' },
            { id: '3', name: 'Alex', wishlist: '' }
          ];
        }
      }

      saveState() {
        localStorage.setItem('morgan_santa_participants', JSON.stringify(this.participants));
      }

      clearAll() {
        this.participants = [];
        this.saveState();
        this.renderParticipants();
      }

      addParticipant() {
        const nameInput = document.getElementById('new-name');
        const wishlistInput = document.getElementById('new-wishlist');
        const name = nameInput.value.trim();
        const wishlist = wishlistInput.value.trim();

        if (!name) return;

        const newId = Date.now().toString(36) + Math.random().toString(36).substring(2, 5);
        this.participants.push({ id: newId, name, wishlist });
        
        nameInput.value = '';
        wishlistInput.value = '';
        this.saveState();
        this.renderParticipants();
      }

      removeParticipant(id) {
        this.participants = this.participants.filter(p => p.id !== id);
        this.saveState();
        this.renderParticipants();
      }

      renderParticipants() {
        const container = document.getElementById('participants-list');
        if (this.participants.length === 0) {
          container.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">No participants added yet. Enter names above!</div>`;
          return;
        }
        container.innerHTML = this.participants.map(p => `
          <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200">
            <div>
              <span class="font-bold text-slate-800 text-sm">${p.name}</span>
              ${p.wishlist ? `<p class="text-xs text-slate-500 italic">${p.wishlist}</p>` : ''}
            </div>
            <button onclick="app.removeParticipant('${p.id}')" class="text-slate-400 hover:text-red-600 p-2">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `).join('');
      }

      generateDraw() {
        if (this.participants.length < 3) {
          alert('Please add at least 3 people to perform a Secret Santa draw.');
          return;
        }

        let receivers = [...this.participants];
        let valid = false;
        let attempts = 0;

        while (!valid && attempts < 100) {
          attempts++;
          valid = true;
          receivers = [...this.participants].sort(() => Math.random() - 0.5);
          this.matches = {};

          for (let i = 0; i < this.participants.length; i++) {
            if (this.participants[i].id === receivers[i].id) {
              valid = false;
              break;
            }
            this.matches[this.participants[i].id] = receivers[i].id;
          }
        }

        if (!valid) {
          alert('Draw failed to find valid pairings without self-draws. Please try again.');
          return;
        }

        this.showTab('results');
      }

      showTab(tab) {
        document.getElementById('view-setup').classList.toggle('hidden', tab !== 'setup');
        document.getElementById('view-results').classList.toggle('hidden', tab !== 'results');
        if (tab === 'results') this.renderResults();
      }

      renderResults() {
        const container = document.getElementById('results-list');
        const baseUrl = window.location.href.split('#')[0].split('?')[0];

        container.innerHTML = this.participants.map(p => {
          const receiverId = this.matches[p.id];
          const receiver = this.participants.find(r => r.id === receiverId);
          
          const payload = {
            giverName: p.name,
            receiverName: receiver ? receiver.name : '',
            receiverWishlist: receiver ? receiver.wishlist : ''
          };

          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
          const secretUrl = `${baseUrl}#draw=${encoded}`;
          const smsText = `Hi ${p.name}! Click here to view your secret Christmas present recipient: ${secretUrl}`;

          return `
            <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-slate-800 text-sm">${p.name}</span>
                <button onclick="navigator.clipboard.writeText('${smsText}'); alert('SMS text copied to clipboard!');" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-lg">
                  Copy SMS Text
                </button>
              </div>
              <input type="text" readonly value="${secretUrl}" class="w-full text-xs bg-slate-50 border p-2 rounded text-slate-500 select-all">
            </div>
          `;
        }).join('');
      }

      checkURLForReveal() {
        const hash = window.location.hash.substring(1);
        if (hash.includes('draw=')) {
          const encoded = hash.split('draw=')[1];
          try {
            const data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
            this.showRevealModal(data);
          } catch (e) {
            console.error('Failed to parse reveal URL:', e);
          }
        }
      }

      showRevealModal(data) {
        document.getElementById('reveal-target-name').innerText = `Hello, ${data.giverName}!`;
        document.getElementById('assigned-person-name').innerText = data.receiverName;
        document.getElementById('assigned-person-wishlist').innerText = data.receiverWishlist || 'No specific wishlist provided.';

        document.getElementById('reveal-step-confirm').classList.remove('hidden');
        document.getElementById('reveal-step-unwrap').classList.add('hidden');
        document.getElementById('reveal-step-final').classList.add('hidden');

        document.getElementById('reveal-modal').classList.remove('hidden');
      }

      proceedToUnwrap() {
        document.getElementById('reveal-step-confirm').classList.add('hidden');
        document.getElementById('reveal-step-unwrap').classList.remove('hidden');
      }

      unwrapGiftAnimation() {
        const box = document.getElementById('interactive-gift');
        box.classList.add('open');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        setTimeout(() => {
          document.getElementById('reveal-step-unwrap').classList.add('hidden');
          document.getElementById('reveal-step-final').classList.remove('hidden');
        }, 900);
      }

      closeRevealModal() {
        document.getElementById('reveal-modal').classList.add('hidden');
      }
    }

    const app = new SecretSantaApp();
  </script>
</body>
</html>
