<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Festive Secret Santa Draw 🎁</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Mountains of Christmas & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            xmas: {
              red: '#C41E3A',
              darkred: '#780016',
              green: '#165B33',
              lightgreen: '#1BB955',
              gold: '#F8B229',
              golddark: '#D4AF37',
              cream: '#FFFDD0',
              snow: '#F4F7F6'
            }
          },
          fontFamily: {
            festive: ['"Mountains of Christmas"', 'cursive'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      color: #333;
      overflow-x: hidden;
    }
    
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .gift-container { perspective: 1000px; }
    .gift-box {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }
    .gift-box:hover { transform: scale(1.05) rotateY(5deg); }
    .gift-lid {
      position: absolute;
      top: 0; left: 0;
      width: 180px; height: 45px;
      background: #C41E3A;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform-origin: top left;
    }
    .gift-box.open .gift-lid { transform: rotate(-110deg) translateY(-20px); }
    .gift-body {
      position: absolute;
      top: 40px; left: 10px;
      width: 160px; height: 130px;
      background: #900C3F;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .ribbon-v {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: 30px; height: 100%; background: #F8B229;
    }
    .ribbon-h {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 100%; height: 30px; background: #F8B229;
    }
    .bow {
      position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
      width: 60px; height: 30px;
    }
    .bow::before, .bow::after {
      content: ''; position: absolute; width: 30px; height: 25px;
      border: 4px solid #F8B229; border-radius: 50% 50% 0 50%;
    }
    .bow::before { left: 0; transform: rotate(30deg); }
    .bow::after { right: 0; transform: rotate(-30deg) scaleX(-1); }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(22, 91, 51, 0.4); border-radius: 10px; }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 flex flex-col min-h-screen">
  
  <canvas id="snow-canvas"></canvas>

  <header class="relative z-20 py-6 px-4 text-center border-b border-white/10 bg-slate-900/40 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.showTab('setup')">
        <span class="text-4xl">🎄</span>
        <div class="text-left">
          <h1 class="font-festive text-3xl md:text-4xl text-xmas-gold tracking-wide font-bold drop-shadow">Family Holiday Draw</h1>
          <p class="text-xs text-emerald-200">Secret Santa Made Simple & Private</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 bg-slate-800/80 p-1.5 rounded-full border border-amber-500/30 text-sm">
        <button id="nav-setup-btn" onclick="app.showTab('setup')" class="px-4 py-1.5 rounded-full font-medium transition-all text-white bg-xmas-red shadow">
          <i class="fa-solid fa-users-gear mr-1"></i> Setup & Draw
        </button>
        <button id="nav-results-btn" onclick="app.showTab('results')" class="px-4 py-1.5 rounded-full font-medium transition-all text-slate-300 hover:text-white">
          <i class="fa-solid fa-gift mr-1"></i> Sharing Links
        </button>
      </div>
    </div>
  </header>

  <main class="relative z-20 flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 my-4">

    <!-- SETUP VIEW -->
    <div id="view-setup" class="space-y-6">
      <div class="glass-card rounded-2xl p-5 md:p-6 border-t-4 border-xmas-red">
        <div class="flex items-center justify-between mb-4 border-b pb-3">
          <h2 class="text-xl font-bold text-xmas-darkred flex items-center gap-2">
            <i class="fa-solid fa-sliders text-xmas-gold"></i> Event Details
          </h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Group / Event Name</label>
            <input type="text" id="event-name" value="Morgan Secret Santa 2026" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-xmas-green text-slate-800 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Suggested Gift Budget</label>
            <input type="text" id="event-budget" value="$50 Max" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-xmas-green text-slate-800 text-sm">
          </div>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-5 md:p-6 border-t-4 border-xmas-green">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 border-b pb-3">
          <h2 class="text-xl font-bold text-xmas-green flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-xmas-gold"></i> Add Participants
          </h2>
          <button onclick="app.clearAll()" class="text-xs text-red-600 hover:text-red-800 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-trash-can"></i> Clear All Names
          </button>
        </div>

        <form onsubmit="app.addParticipant(event)" class="flex flex-col sm:flex-row gap-2 mb-6">
          <div class="flex-1">
            <input type="text" id="new-name" placeholder="Member Name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
          </div>
          <div class="sm:w-1/3">
            <input type="text" id="new-wishlist" placeholder="Optional Wishlist / Hint" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
          </div>
          <button type="submit" class="bg-xmas-green hover:bg-emerald-800 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">
            <i class="fa-solid fa-plus"></i> Add
          </button>
        </form>

        <div id="participants-list" class="space-y-2 max-h-64 overflow-y-auto pr-1 custom-scrollbar"></div>
      </div>

      <div class="text-center pt-2">
        <button onclick="app.generateDraw()" class="bg-gradient-to-r from-xmas-red via-red-600 to-xmas-darkred text-white text-lg font-bold px-10 py-4 rounded-2xl shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-3 mx-auto">
          <i class="fa-solid fa-dice text-2xl text-xmas-gold"></i>
          <span>Perform Christmas Draw!</span>
        </button>
      </div>
    </div>

    <!-- RESULTS VIEW -->
    <div id="view-results" class="hidden space-y-6">
      <div class="bg-emerald-900/80 border border-emerald-500/40 rounded-2xl p-4 text-white flex justify-between items-center">
        <div>
          <h3 class="font-bold text-emerald-100">Draw Completed! 🎉</h3>
          <p class="text-xs text-emerald-200">Copy the direct texts below to send to everyone.</p>
        </div>
        <button onclick="app.showTab('setup')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-lg">
          <i class="fa-solid fa-rotate-left mr-1"></i> Edit Setup
        </button>
      </div>

      <div class="glass-card rounded-2xl p-5 md:p
